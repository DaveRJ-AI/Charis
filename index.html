<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Charis Legacy Foundation supports charitable and educational organizations whose work strengthens communities through humanitarian care, responsible stewardship, and thoughtful partnership."
    />
    <title>Charis Legacy Foundation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <!-- Netlify detects forms in built HTML before React renders. Keep these
         field names in sync with ContactPage.jsx. Recipients live in Netlify. -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="subject" type="hidden" value="Charis Legacy Foundation — website inquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="organization" />
      <select name="inquiry-type"><option>General inquiry</option><option>Donation inquiry</option><option>Existing partnership</option><option>Invited follow-up</option></select>
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
  </body>
</html>
